name: Auto-commit Agent Updates

# КОГДА запускается: когда агент обновляет файлы
# ЛУЧШИЙ ВАРИАНТ: триггер от специального события или Schedule

on:
  # Опция 1: По расписанию (каждый день в 9:00 UTC)
  schedule:
    - cron: '0 9 * * *'  # Ежедневно в 9:00 UTC

  # Опция 2: Ручной запуск
  workflow_dispatch:
    inputs:
      files:
        description: 'Files to commit (comma-separated)'
        required: false
        default: 'agents/prompts/**,src/verification/**'

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Checkout репозитория
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Шаг 2: Проверить, есть ли изменения
      - name: Check for changes
        id: check
        run: |
          git diff --name-only HEAD > changed_files.txt
          if [ -s changed_files.txt ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changed files:"
            cat changed_files.txt
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      # Шаг 3: Валидация - только РАЗРЕШЁННЫЕ файлы
      - name: Validate file changes
        if: steps.check.outputs.has_changes == 'true'
        run: |
          echo "Checking if only allowed files changed..."

          ALLOWED_PATTERNS=(
            "agents/prompts/**"
            "src/verification/**"
            "src/observability/**"
            "docs/generated/**"
            "package-lock.json"
          )

          while IFS= read -r file; do
            echo "Checking: $file"
            FOUND=false
            for pattern in "${ALLOWED_PATTERNS[@]}"; do
              if [[ $file == $pattern ]]; then
                FOUND=true
                break
              fi
            done
            if [ "$FOUND" = false ]; then
              echo "ERROR: File $file is not allowed to auto-commit!"
              exit 1
            fi
          done < changed_files.txt

          echo "✅ All changed files are allowed for auto-commit"

      # Шаг 4: Проверить синтаксис (для prompts)
      - name: Validate prompts syntax
        if: steps.check.outputs.has_changes == 'true'
        run: |
          echo "Validating prompt files..."
          for file in agents/prompts/*.md; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              # Проверить, что файл не пустой
              if [ ! -s "$file" ]; then
                echo "ERROR: $file is empty!"
                exit 1
              fi
              # Проверить, что есть заголовок
              if ! head -1 "$file" | grep -q "^#"; then
                echo "WARNING: $file doesn't start with markdown header"
              fi
            fi
          done
          echo "✅ Prompts validation passed"

      # Шаг 5: Установить git config
      - name: Setup git config
        run: |
          git config --local user.email "automation@bronvera.dev"
          git config --local user.name "BRONVERA Auto-Commit Bot"

      # Шаг 6: Коммит ТОЛЬКО разрешённых файлов
      - name: Create commit
        if: steps.check.outputs.has_changes == 'true'
        run: |
          # Добавить ТОЛЬКО изменённые файлы (не весь репозиторий!)
          git add agents/prompts/*.md src/verification/*.js src/observability/*.js docs/generated/* package-lock.json 2>/dev/null || true

          # Проверить, что есть что коммитить
          if git diff --cached --quiet; then
            echo "No changes to commit after filtering"
            exit 0
          fi

          # Создать коммит с понятным сообщением
          git commit -m "chore: auto-update agent configurations and generated files

This commit was automatically generated by BRONVERA Auto-Commit Bot.

Updates:
- Agent prompts (orchestrator, selector, assessor, market-analyst)
- Verification rules and logic
- Generated documentation
- Dependencies

All changes were validated before commit.

Co-Authored-By: BRONVERA Bot <automation@bronvera.dev>"

      # Шаг 7: Запушить в main
      - name: Push changes
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git push origin main
          echo "✅ Changes pushed to origin/main"

      # Шаг 8: Логирование результата
      - name: Log result
        run: |
          echo "Auto-commit workflow completed"
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git log --oneline -1

  # ДОПОЛНИТЕЛЬНАЯ РАБОТА: Проверка целостности
  validate:
    runs-on: ubuntu-latest
    needs: auto-commit

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # Проверить main после коммита

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test 2>/dev/null || echo "No tests found, skipping"

      - name: Validate JSON files
        run: |
          find . -name "*.json" -type f ! -path "./node_modules/*" | while read file; do
            node -e "JSON.parse(require('fs').readFileSync('$file', 'utf8'))" || echo "Invalid JSON: $file"
          done

      - name: Send notification on failure
        if: failure()
        run: |
          echo "❌ Validation failed! Check the logs above."
          exit 1
